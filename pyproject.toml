[project]
name = "django-aio"
version = "1.0.0"
description = "Django All-In-One: A modern Django starter with REST API, WebSockets, Celery, and Admin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DjangoAIO Team" }]
keywords = ["django", "rest-api", "websockets", "celery", "admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Django Core
    "django>=5.2,<6.0",
    "django-environ>=0.11.2",

    # Admin UI
    "django-jet-reboot>=1.3.8",

    # Django Utilities
    "django-autoslug>=1.9.9",
    "django-crequest>=2018.5.11",

    # REST Framework
    "djangorestframework>=3.15.2",
    "djangorestframework-simplejwt>=5.4.0",
    "django-cors-headers>=4.6.0",
    "drf-spectacular[sidecar]>=0.28.0",

    # Async & WebSockets
    "channels>=4.2.0",
    "channels-redis>=4.2.1",
    "daphne>=4.1.2",

    # Task Queue
    "celery[redis]>=5.4.0",

    # ASGI/WSGI Servers
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",

    # Database
    "psycopg[binary]>=3.2.4",

    # Utilities
    "pillow>=11.1.0",
    "python-dateutil>=2.9.0",
    "httpx>=0.28.0",
    "user-agents>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main", "config"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ"]
ignore = ["E501", "DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["main"]
omit = ["*/migrations/*", "*/tests/*"]
